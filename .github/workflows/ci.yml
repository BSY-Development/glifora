# CI do Glifora (W1-02; W0-03 §7). Job `check`: instalar, tipos, lint, testes, build.
# Job `e2e`: testes do Revisor (W1-04) no Chromium, contra o `vite preview`.
# Job `deploy` (W1-13): só em push na `main`, publica o MESMO `dist/` que o `check` testou (artefato, sem novo build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo possível. Nunca `pull_request_target`: PR de fork roda sem segredo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Na `main` nada é cortado no meio (um deploy interrompido deixaria a produção em estado incerto).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Com dist/ pronto, a varredura do build é obrigatória (sem dist/ ela falharia em vez de pular).
      - run: REQUIRE_DIST=1 npx vitest run tests/security/csp-build.test.ts
      # O deploy publica exatamente este dist/ (já testado acima). Só na main; PR não precisa.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O webServer do playwright.config.ts faz o build e sobe o `vite preview` (com a CSP do _headers) na porta 4173.
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Só em push na main, depois dos dois. O ambiente `production` só aceita a main e guarda os secrets.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://glifora.pages.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Wrangler por npx, em versão exata e só neste job (pesado, não entra no package.json). O `.npmrc` do projeto
      # (ignore-scripts=true) vale aqui: o wrangler publica sem rodar scripts de instalação.
      # Os secrets ficam só neste passo, em variáveis de ambiente (o Actions os mascara no log).
      - name: Publicar no Cloudflare Pages
        run: npx --yes wrangler@4.165.0 pages deploy dist --project-name=glifora --branch=main --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      # Sem secret aqui: busca a URL real e compara cabeçalhos, commit e rota profunda (tenta por ~3 min).
      - name: Conferir a produção
        run: node scripts/ci/verify-deploy.ts
        env:
          DEPLOY_URL: https://glifora.pages.dev
          EXPECTED_COMMIT: ${{ github.sha }}
